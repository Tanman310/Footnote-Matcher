# Runs the automated tests in tests/ with Node's built-in test runner.
# No npm install and no build step: the tests use only node:test and node:vm.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax of src/Code.js
        run: node --check src/Code.js
      - name: Run tests
        run: node --test
